{% extends 'base.html' %}

{% block heading %}
Add Student
{% endblock %}

{% block content %}

<form method="post" enctype="multipart/form-data" class="needs-validation" novalidate>

    <div class="page-actions">

        <p class="text-muted mb-0">
            Create a secure student profile.
        </p>

        <div>
            <a href="/admin/students" class="btn btn-light">
                Cancel
            </a>

            <button type="reset" class="btn btn-outline-secondary">
                Reset
            </button>

            <button type="submit" class="btn btn-primary">
                Save Student
            </button>
        </div>

    </div>

    <div class="form-card">

        <h3>
            <i class="bi bi-person-vcard me-2"></i>
            Student Profile
        </h3>

        <div class="row g-3">

            <div class="col-md-6">
                <label class="form-label">Full Name *</label>
                <input type="text" name="username" class="form-control" placeholder="Enter full name" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">USN *</label>
                <input type="text" name="usn" class="form-control" placeholder="Enter USN" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Date of Birth *</label>
                <input type="date" name="dob" class="form-control" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Email Address *</label>
                <input type="email" name="email" class="form-control" placeholder="Enter email address" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Phone Number *</label>
                <input type="tel" name="phone" class="form-control" placeholder="Enter phone number" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Gender *</label>
                <select name="gender" class="form-select" required>
                    <option value="">Select Gender</option>
                    <option>Female</option>
                    <option>Male</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="col-md-6">
                <label class="form-label">Department *</label>
                <input type="text" name="department" class="form-control" placeholder="Enter department" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Class *</label>
                <input type="text" name="class" class="form-control" placeholder="Enter class" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Semester *</label>
                <input type="number" name="semester" class="form-control" placeholder="Enter semester" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Section *</label>
                <input type="text" name="section" class="form-control" placeholder="Enter section" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Batch *</label>
                <input type="text" name="batch" class="form-control" placeholder="Enter batch" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Admission Year *</label>
                <input type="number" name="admission_year" class="form-control" placeholder="Enter admission year" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Parent Name *</label>
                <input type="text" name="parent_name" class="form-control" placeholder="Enter parent name" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Parent Phone *</label>
                <input type="tel" name="parent_phone" class="form-control" placeholder="Enter parent phone" required>
            </div>

            <div class="col-12">
                <label class="form-label">Address *</label>
                <textarea name="address" class="form-control" rows="3" placeholder="Enter address" required></textarea>
            </div>

            <div class="col-md-6">
                <label class="form-label">CGPA</label>
                <input type="number" step="0.01" name="cgpa" class="form-control" placeholder="Enter CGPA">
            </div>

            <div class="col-md-6">
                <label class="form-label">Attendance (%)</label>
                <input type="number" name="attendance" class="form-control" placeholder="Enter attendance percentage">
            </div>

            <div class="col-md-6">
                <label class="form-label">Career Goal</label>
                <input type="text" name="career_goal" class="form-control" placeholder="Enter career goal">
            </div>

            <div class="col-md-6">
                <label class="form-label">Interest Domain</label>
                <input type="text" name="interest_domain" class="form-control" placeholder="Enter interest domain">
            </div>

            <div class="col-md-6">
                <label class="form-label">Stress Level</label>
                <select name="stress_level" class="form-select">
                    <option value="">Select Stress Level</option>
                    <option>Low</option>
                    <option>Medium</option>
                    <option>High</option>
                </select>
            </div>

            <div class="col-md-6">
                <label class="form-label">Student Photo</label>
                <input
    type="file"
    name="photo"
    class="form-control"
    accept=".jpg,.jpeg,image/jpeg"
>
<div class="form-text text-muted">
    Only JPG/JPEG images are allowed (Maximum 2 MB).
</div>
            </div>

        </div>

    </div>

</form>

{% endblock %}
