{% extends 'base.html' %}

{% block heading %}
Add Teacher
{% endblock %}

{% block content %}

<form method="post" enctype="multipart/form-data" class="needs-validation" novalidate>

    <div class="page-actions">

        <p class="text-muted mb-0">
            Create a secure teacher profile.
        </p>

        <div>
            <a href="/admin/teachers" class="btn btn-light">
                Cancel
            </a>

            <button type="reset" class="btn btn-outline-secondary">
                Reset
            </button>

            <button type="submit" class="btn btn-primary">
                Save Teacher
            </button>
        </div>

    </div>

    <div class="form-card">

        <h3>
            <i class="bi bi-person-workspace me-2"></i>
            Teacher Profile
        </h3>

        <div class="row g-3">

            <div class="col-md-6">
                <label class="form-label">Full Name *</label>
                <input type="text" name="username" class="form-control" placeholder="Enter full name" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Employee ID *</label>
                <input type="text" name="employee_id" class="form-control" placeholder="Enter employee ID" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Date of Birth *</label>
                <input type="date" name="dob" class="form-control" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Email Address *</label>
                <input type="email" name="email" class="form-control" placeholder="Enter email address" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Phone Number *</label>
                <input type="tel" name="phone" class="form-control" placeholder="Enter phone number" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Gender *</label>
                <select name="gender" class="form-select" required>
                    <option value="">Select Gender</option>
                    <option>Female</option>
                    <option>Male</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="col-md-6">
                <label class="form-label">Department *</label>
                <input type="text" name="department" class="form-control" placeholder="Enter department" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Designation *</label>
                <input type="text" name="designation" class="form-control" placeholder="Enter designation" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Qualification *</label>
                <input type="text" name="qualification" class="form-control" placeholder="Enter qualification" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Experience *</label>
                <input type="text" name="experience" class="form-control" placeholder="Enter experience" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Office Room *</label>
                <input type="text" name="office_room" class="form-control" placeholder="Enter office room" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Teacher Photo</label>
                <input
    type="file"
    name="photo"
    class="form-control"
    accept=".jpg,.jpeg,image/jpeg"
>
<div class="form-text text-muted">
    Only JPG/JPEG images are allowed (Maximum 2 MB).
</div>
            </div>

        </div>

    </div>

</form>

{% endblock %}
